<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu | Campus Bites</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/menu.css">

</head>


<body>

    <header class="navbar">

        <div class="logo">
            🍽️
            <span>Campus Bites</span>
        </div>


        <button class="nav-toggle" type="button" aria-label="Open navigation" aria-controls="primaryNav"
            aria-expanded="false">
            <span></span><span></span><span></span>
        </button>

        <nav id="primaryNav">

            <a href="index.html">
                Home
            </a>

            <a href="canteens.html">
                Canteens
            </a>

            <a href="menu.html" class="active">
                Browse Cuisine
            </a>

        </nav>

    </header>


    <main class="menu-page">

        <section class="menu-hero">

            <p class="eyebrow">
                CAMPUS FOOD
            </p>

            <h1 id="canteenTitle">
                Campus Menu
            </h1>

            <p>
                Find something delicious for your
                next lecture break.
            </p>

        </section>


        <section class="menu-controls">

            <div class="search-wrapper">

                <span>
                    🔍
                </span>

                <input type="text" id="menuSearch" placeholder="Search food..." autocomplete="off">

            </div>


            <!-- ==============================
                 CATEGORY BUTTONS
            =============================== -->

            <div class="category-buttons" id="categoryButtons">

                <button class="category-btn active" data-category="all">
                    All
                </button>

            </div>


            <!-- ==============================
                 CLEAR FILTERS
            =============================== -->

            <button id="clearFilters" class="clear-button" type="button">
                Clear filters
            </button>

            <p class="result-summary" id="resultSummary" aria-live="polite"></p>

        </section>



        <!-- ==============================
             MENU CONTAINER
        =============================== -->

        <section class="menu-container" id="menuContainer">

            <!-- Menu items will be dynamically inserted here -->
        </section>


        <!-- ==============================
             NO RESULTS MESSAGE
        =============================== -->

        <div id="noResults" class="no-results">

            <div>
                🔍
            </div>

            <h2>
                Nothing found
            </h2>

            <p>
                Try another food item or category.
            </p>

        </div>

    </main>



    <!-- ==============================
         FOOTER
    =============================== -->

    <footer class="site-footer">

        <div class="footer-bottom">

            <span>
                © 2026 Campus Bites
            </span>

            <span>
                Made for campus life.
            </span>

        </div>

    </footer>



    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script src="js/menu.js"></script>

</body>

</html>

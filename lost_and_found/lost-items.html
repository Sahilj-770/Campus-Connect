
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Lost Items - Campus Lost & Found
    </title>

    <link
        rel="stylesheet"
        href="lost.css"
    >

</head>


<body>


    <!-- =====================================================
         NAVIGATION BAR
         ===================================================== -->

    <header class="navbar">

        <div class="logo">

            <img
                src="logo.png"
                alt="Lost & Found Logo"
                class="logo-image"
            >

            <span>
                Campus Lost & Found
            </span>

        </div>


        <nav>

            <a href="lost.html">
                Home
            </a>

            <a href="lost-items.html">
                Lost Items
            </a>

            <a href="found-items.html">
                Found Items
            </a>

            <a href="browse.html">
                Browse Items
            </a>

        </nav>


        <a
            href="lost.html#report"
            class="login-btn"
        >
            Report Item →
        </a>

    </header>



    <!-- =====================================================
         LOST ITEMS PAGE
         ===================================================== -->

    <section class="items-page">


        <div class="items-heading">

            <p class="small-heading">
                LOST ITEMS
            </p>


            <h1>

                Items that are
                <span>Lost</span>

            </h1>


            <p>

                Browse items that have been reported lost
                by students on campus.

            </p>

        </div>



        <!-- =================================================
             LOST ITEMS
             ================================================= -->

        <div
            class="items-grid"
            id="lostItemsGrid"
        >

            <div
                class="no-items"
                id="loadingMessage"
            >

                <h3>
                    Loading lost items...
                </h3>

                <p>
                    Please wait.
                </p>

            </div>

        </div>


    </section>



    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

        <p>
            © 2026 Campus Lost & Found
        </p>

    </footer>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>


        // =====================================================
        // API
        // =====================================================

        const API_URL =
            "https://campus-connect-n37d.onrender.com/api/lost-found/lost";


        const lostItemsGrid =
            document.getElementById(
                "lostItemsGrid"
            );



        // =====================================================
        // IMAGE MAP
        // =====================================================

        const imageMap = {

            "mobile cover":
                "mobilecover.jpg",

            "mobile":
                "mobile.jpg",

            "black wallet":
                "blackwallet.jpg",

            "wallet":
                "blackwallet.jpg",

            "college id card":
                "collegeidcard.jpg",

            "keychain":
                "keychain.jpg",

            "umbrella":
                "umbrella.jpg",

            "laptop charger":
                "laptopcharger.jpg",

            "notebook":
                "notebook.jpg",

            "earphones":
                "earphones.jpg",

            "usb drive":
                "usbdrive.jpg",

            "pendrive":
                "usbdrive.jpg",

            "scientific calculator":
                "scientificcalculator.jpg",

            "water bottle":
                "waterbottle.jpg"

        };



        // =====================================================
        // GET IMAGE URL
        // =====================================================

        function getImageUrl(
            databaseImage,
            itemName
        ) {

            const name =
                String(itemName || "")
                    .trim()
                    .toLowerCase();


            /*
             * IMPORTANT
             *
             * For known items, use the exact
             * Express URL directly.
             *
             * This avoids all relative-path
             * problems.
             */

            if (
                imageMap[name]
            ) {

                return (
                    window.location.origin +
                    "/uploads/items/" +
                    imageMap[name] +
                    "?v=100"
                );

            }


            // -------------------------------------------------
            // IF DATABASE CONTAINS AN IMAGE
            // -------------------------------------------------

            let image =
                String(
                    databaseImage || ""
                ).trim();


            if (
                image === ""
            ) {

                return "";

            }


            // -------------------------------------------------
            // BASE64
            // -------------------------------------------------

            if (
                image.startsWith(
                    "data:image/"
                )
            ) {

                return image;

            }


            // -------------------------------------------------
            // FULL URL
            // -------------------------------------------------

            if (
                image.startsWith(
                    "http://"
                ) ||
                image.startsWith(
                    "https://"
                )
            ) {

                return image;

            }


            // -------------------------------------------------
            // CLEAN PATH
            // -------------------------------------------------

            image =
                image.replace(
                    /\\/g,
                    "/"
                );


            image =
                image.replace(
                    /^\/+/,
                    ""
                );


            // Remove lost_and_found if already present

            if (
                image.startsWith(
                    "lost_and_found/"
                )
            ) {

                image =
                    image.substring(
                        "lost_and_found/".length
                    );

            }


            // -------------------------------------------------
            // FINAL DATABASE IMAGE URL
            // -------------------------------------------------

            return (
                window.location.origin +
                "/lost_and_found/" +
                image +
                "?v=100"
            );

        }



        // =====================================================
        // ESCAPE HTML
        // =====================================================

        function escapeHTML(
            value
        ) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        // =====================================================
        // IMAGE ERROR HANDLER
        // =====================================================

        function imageError(
            img,
            itemName
        ) {

            console.error(
                "IMAGE FAILED:",
                img.src
            );


            const name =
                String(itemName || "")
                    .trim()
                    .toLowerCase();


            /*
             * If the known image fails,
             * try the same path without
             * cache parameter.
             */

            if (
                imageMap[name] &&
                !img.dataset.retry
            ) {

                img.dataset.retry =
                    "yes";


                img.src =
                    window.location.origin +
                    "/uploads/items/" +
                    imageMap[name];

                return;

            }


            // -------------------------------------------------
            // FINAL FALLBACK
            // -------------------------------------------------

            img.style.display =
                "none";


            const parent =
                img.parentElement;


            if (
                parent &&
                !parent.querySelector(
                    ".image-fallback"
                )
            ) {

                const span =
                    document.createElement(
                        "span"
                    );


                span.className =
                    "image-fallback";


                span.style.fontSize =
                    "60px";


                span.textContent =
                    "📦";


                parent.appendChild(
                    span
                );

            }

        }



        // =====================================================
        // CREATE CARD
        // =====================================================

        function createCard(
            item
        ) {


            const itemName =
                item.item_name ||
                "Unknown Item";


            const description =
                item.description ||
                "No description provided.";


            const location =
                item.location ||
                "Location not specified";


            const status =
                item.status ||
                "lost";


            // -------------------------------------------------
            // IMAGE URL
            // -------------------------------------------------

            const imageUrl =
                getImageUrl(
                    item.image,
                    itemName
                );


            console.log(
                "--------------------------------"
            );


            console.log(
                "ITEM:",
                itemName
            );


            console.log(
                "DATABASE IMAGE:",
                item.image
            );


            console.log(
                "FINAL IMAGE:",
                imageUrl
            );


            console.log(
                "--------------------------------"
            );


            // -------------------------------------------------
            // IMAGE
            // -------------------------------------------------

            let imageHTML = `

                <span
                    class="image-fallback"
                    style="
                        font-size:60px;
                    "
                >
                    📦
                </span>

            `;


            if (
                imageUrl !== ""
            ) {

                imageHTML = `

                    <img
                        src="${imageUrl}"
                        alt="${escapeHTML(itemName)}"
                        class="lost-item-image"
                        onerror="imageError(this, '${escapeHTML(itemName)}')"
                    >

                `;

            }



            // -------------------------------------------------
            // CARD
            // -------------------------------------------------

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "item-card";


            card.setAttribute(
                "data-status",
                String(status).toLowerCase()
            );


            card.innerHTML = `

                <div class="item-image blue-image">

                    ${imageHTML}

                </div>


                <div class="item-content">


                    <div class="item-top">

                        <span class="status lost">

                            LOST

                        </span>


                        <span class="date">

                            Recently

                        </span>

                    </div>


                    <h3>

                        ${escapeHTML(itemName)}

                    </h3>


                    <p>

                        ${escapeHTML(description)}

                    </p>


                    <div class="item-location">

                        📍

                        ${escapeHTML(location)}

                    </div>


                </div>

            `;


            return card;

        }



        // =====================================================
        // LOAD LOST ITEMS
        // =====================================================

        async function loadLostItems() {


            try {


                console.log(
                    "Loading from:",
                    API_URL
                );


                const response =
                    await fetch(
                        API_URL +
                        "?v=100"
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        "HTTP Error: " +
                        response.status
                    );

                }


                const items =
                    await response.json();


                console.log(
                    "ITEMS FROM DATABASE:",
                    items
                );


                lostItemsGrid.innerHTML =
                    "";


                // -------------------------------------------------
                // NO ITEMS
                // -------------------------------------------------

                if (
                    !Array.isArray(items) ||
                    items.length === 0
                ) {

                    lostItemsGrid.innerHTML = `

                        <div class="no-items">

                            <h3>
                                No lost items reported yet.
                            </h3>

                            <p>
                                Be the first to report a lost item.
                            </p>

                        </div>

                    `;

                    return;

                }


                // -------------------------------------------------
                // ADD CARDS
                // -------------------------------------------------

                items.forEach(
                    function(item) {

                        const card =
                            createCard(
                                item
                            );


                        lostItemsGrid.appendChild(
                            card
                        );

                    }
                );


            }


            catch (
                error
            ) {


                console.error(
                    "ERROR:",
                    error
                );


                lostItemsGrid.innerHTML = `

                    <div class="no-items">

                        <h3>
                            Could not load lost items.
                        </h3>

                        <p>
                            Please make sure the Express server is running.
                        </p>

                    </div>

                `;

            }

        }



        // =====================================================
        // START
        // =====================================================

        loadLostItems();


    </script>


</body>

</html>

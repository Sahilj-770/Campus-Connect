
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Browse Items - Campus Lost & Found
    </title>

    <link
        rel="stylesheet"
        href="lost.css"
    >

    <style>

        .browse-results {
            margin-top: 50px;
        }

        .browse-message {
            text-align: center;
            padding: 60px 20px;
            color: #71819a;
        }

        .browse-message h3 {
            color: #14213d;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .browse-card {
            overflow: hidden;
        }

        .browse-card .item-image {
            min-height: 260px;
        }

        .browse-card .item-image img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
        }

        .details-btn {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #14213d;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .details-btn:hover {
            background: #c85a00;
        }

        .details-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            background: #f7f8fa;
            display: none;
        }

        .details-box.show {
            display: block;
        }

        .details-box p {
            margin: 7px 0;
        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">

            <img
                src="logo.png"
                alt="Lost & Found Logo"
                class="logo-image"
            >

            <span>
                Campus Lost & Found
            </span>

        </div>


        <nav>

            <a href="lost.html">
                Home
            </a>

            <a href="lost-items.html">
                Lost Items
            </a>

            <a href="found-items.html">
                Found Items
            </a>

            <a href="browse.html">
                Browse Items
            </a>

        </nav>


        <a
            href="lost.html#report"
            class="login-btn"
        >
            Report Item →
        </a>

    </header>



    <!-- ================= BROWSE PAGE ================= -->

    <section class="items-page">


        <div class="items-heading">

            <p class="small-heading">
                BROWSE ITEMS
            </p>


            <h1>

                Find an
                <span>Item</span>

            </h1>


            <p>

                Search through lost and found items
                reported by students on campus.

            </p>

        </div>



        <!-- ================= SEARCH ================= -->

        <div class="browse-controls">

            <input
                type="text"
                id="browseSearch"
                placeholder="Search for an item..."
            >


            <select id="statusFilter">

                <option value="all">
                    All Items
                </option>

                <option value="lost">
                    Lost Items
                </option>

                <option value="found">
                    Found Items
                </option>

            </select>


            <button id="browseButton">

                Search

            </button>

        </div>



        <!-- ================= RESULTS ================= -->

        <div
            class="items-grid browse-results"
            id="browseResults"
        >

            <div class="browse-message">

                <h3>
                    Loading items...
                </h3>

                <p>
                    Please wait.
                </p>

            </div>

        </div>


    </section>



    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 Campus Lost & Found
        </p>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        // =====================================================
        // EXPRESS API
        // =====================================================

        const API_BASE =
            "/api/lost-found";


        const resultsContainer =
            document.getElementById(
                "browseResults"
            );


        const searchInput =
            document.getElementById(
                "browseSearch"
            );


        const statusFilter =
            document.getElementById(
                "statusFilter"
            );


        const searchButton =
            document.getElementById(
                "browseButton"
            );



        // =====================================================
        // IMAGE MAP
        // =====================================================

        const imageMap = {

            "mobile cover":
                "uploads/items/mobilecover.jpg",

            "mobile":
                "uploads/items/mobile.jpg",

            "black wallet":
                "uploads/items/blackwallet.jpg",

            "college id card":
                "uploads/items/collegeidcard.jpg",

            "keychain":
                "uploads/items/keychain.jpg",

            "umbrella":
                "uploads/items/umbrella.jpg",

            "laptop charger":
                "uploads/items/laptopcharger.jpg",

            "notebook":
                "uploads/items/notebook.jpg",

            "earphones":
                "uploads/items/earphones.jpg",

            "usb drive":
                "uploads/items/usbdrive.jpg",

            "scientific calculator":
                "uploads/items/scientificcalculator.jpg",

            "water bottle":
                "uploads/items/waterbottle.jpg"

        };



        // =====================================================
        // IMAGE URL
        // =====================================================

        function getImageUrl(item) {


            let image =
                String(item.image || "").trim();


            // -------------------------------------------------
            // NO IMAGE
            // -------------------------------------------------

            if (image === "") {

                return getFallbackImage(item);

            }



            // -------------------------------------------------
            // DATA IMAGE
            // -------------------------------------------------

            if (
                image.startsWith("data:image/")
            ) {

                return image;

            }



            // -------------------------------------------------
            // NORMAL HTTP IMAGE
            // -------------------------------------------------

            if (
                image.startsWith("http://") ||
                image.startsWith("https://")
            ) {

                return image;

            }



            // -------------------------------------------------
            // ABSOLUTE WEBSITE PATH
            // -------------------------------------------------

            if (
                image.startsWith("/")
            ) {

                return image;

            }



            // -------------------------------------------------
            // NORMAL UPLOAD PATH
            //
            // Example:
            // uploads/items/blackwallet.jpg
            // -------------------------------------------------

            image =
                image.replace(/\\/g, "/");


            if (
                image.startsWith("uploads/")
            ) {

                return (
                    "/uploads/" +
                    image
                );

            }



            // -------------------------------------------------
            // OLD CAMPUS-CONNECT PATH
            // -------------------------------------------------

            if (
                image.includes(
                    "/Campus-Connect/lost_and_found/"
                )
            ) {

                const cleanPath =
                    image.split(
                        "/Campus-Connect/lost_and_found/"
                    )[1];

                return (
                    "/lost_and_found/" +
                    cleanPath
                );

            }



            // -------------------------------------------------
            // OLD RELATIVE PATH
            // -------------------------------------------------

            if (
                image.includes(
                    "lost_and_found/"
                )
            ) {

                const cleanPath =
                    image.split(
                        "lost_and_found/"
                    )[1];

                return (
                    "/lost_and_found/" +
                    cleanPath
                );

            }



            // -------------------------------------------------
            // IMAGE FILE NAME ONLY
            // -------------------------------------------------

            if (
                image.endsWith(".jpg") ||
                image.endsWith(".jpeg") ||
                image.endsWith(".png") ||
                image.endsWith(".webp")
            ) {

                return (
                    "/uploads/items/" +
                    image
                );

            }



            // -------------------------------------------------
            // FALLBACK IMAGE
            // -------------------------------------------------

            return getFallbackImage(item);

        }



        // =====================================================
        // FALLBACK IMAGE
        // =====================================================

        function getFallbackImage(item) {


            const itemName =
                String(
                    item.item_name || ""
                )
                .trim()
                .toLowerCase();


            if (
                imageMap[itemName]
            ) {

                return (
                    "/uploads/" +
                    imageMap[itemName]
                );

            }


            return "";

        }



        // =====================================================
        // ESCAPE HTML
        // =====================================================

        function escapeHTML(value) {

            return String(value || "")

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        // =====================================================
        // LOAD BOTH LOST + FOUND ITEMS
        // =====================================================

        async function loadItems() {


            try {


                const lostResponse =
                    await fetch(
                        API_BASE + "/lost"
                    );


                const foundResponse =
                    await fetch(
                        API_BASE + "/found"
                    );


                if (
                    !lostResponse.ok ||
                    !foundResponse.ok
                ) {

                    throw new Error(
                        "Could not load items."
                    );

                }



                const lostItems =
                    await lostResponse.json();


                const foundItems =
                    await foundResponse.json();



                const allLost =
                    Array.isArray(lostItems)
                        ? lostItems
                        : [];


                const allFound =
                    Array.isArray(foundItems)
                        ? foundItems
                        : [];



                // -------------------------------------------------
                // ADD STATUS
                // -------------------------------------------------

                const lost =
                    allLost.map(
                        function(item) {

                            return {

                                ...item,

                                status: "lost"

                            };

                        }
                    );


                const found =
                    allFound.map(
                        function(item) {

                            return {

                                ...item,

                                status: "found"

                            };

                        }
                    );



                // -------------------------------------------------
                // COMBINE
                // -------------------------------------------------

                const allItems =
                    [
                        ...lost,
                        ...found
                    ];



                // -------------------------------------------------
                // STORE GLOBALLY
                // -------------------------------------------------

                window.allBrowseItems =
                    allItems;



                // -------------------------------------------------
                // CHECK FOR SAVED SEARCH
                // -------------------------------------------------

                const savedSearch =
                    sessionStorage.getItem(
                        "browseSearch"
                    );


                if (
                    savedSearch
                ) {

                    searchInput.value =
                        savedSearch;


                    sessionStorage.removeItem(
                        "browseSearch"
                    );


                    searchItems();

                }
                else {

                    displayItems(
                        allItems
                    );

                }


            }
            catch (error) {


                console.error(
                    "Browse error:",
                    error
                );


                resultsContainer.innerHTML = `

                    <div class="browse-message">

                        <h3>
                            Unable to load items
                        </h3>

                        <p>
                            Make sure the Express server
                            is running on port 3000.
                        </p>

                    </div>

                `;

            }

        }



        // =====================================================
        // SEARCH ITEMS
        // =====================================================

        function searchItems() {


            const searchValue =
                searchInput.value
                    .trim()
                    .toLowerCase();


            const selectedStatus =
                statusFilter.value;


            let filtered =
                window.allBrowseItems || [];



            // -------------------------------------------------
            // SEARCH TEXT
            // -------------------------------------------------

            if (
                searchValue !== ""
            ) {

                filtered =
                    filtered.filter(
                        function(item) {


                            const name =
                                String(
                                    item.item_name || ""
                                )
                                .toLowerCase();


                            const description =
                                String(
                                    item.description || ""
                                )
                                .toLowerCase();


                            const location =
                                String(
                                    item.location || ""
                                )
                                .toLowerCase();


                            return (

                                name.includes(
                                    searchValue
                                )

                                ||

                                description.includes(
                                    searchValue
                                )

                                ||

                                location.includes(
                                    searchValue
                                )

                            );

                        }
                    );

            }



            // -------------------------------------------------
            // LOST / FOUND FILTER
            // -------------------------------------------------

            if (
                selectedStatus !== "all"
            ) {

                filtered =
                    filtered.filter(
                        function(item) {

                            return (

                                String(
                                    item.status || ""
                                )
                                .toLowerCase() ===
                                selectedStatus

                            );

                        }
                    );

            }



            displayItems(
                filtered
            );

        }



        // =====================================================
        // DISPLAY ITEMS
        // =====================================================

        function displayItems(items) {


            resultsContainer.innerHTML =
                "";



            if (
                !Array.isArray(items) ||
                items.length === 0
            ) {

                resultsContainer.innerHTML = `

                    <div class="browse-message">

                        <h3>
                            No matching item found.
                        </h3>

                        <p>
                            Try another item name,
                            location or description.
                        </p>

                    </div>

                `;

                return;

            }



            // =================================================
            // CREATE CARDS
            // =================================================

            items.forEach(
                function(item) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "item-card browse-card";



                    const status =
                        String(
                            item.status || ""
                        )
                        .toLowerCase();


                    const statusText =
                        status === "found"
                            ? "FOUND"
                            : "LOST";


                    const statusClass =
                        status === "found"
                            ? "found"
                            : "lost";



                    const itemName =
                        item.item_name ||
                        "Unknown Item";


                    const description =
                        item.description ||
                        "No description available.";


                    const location =
                        item.location ||
                        "Unknown location";


                    const personName =
                        item.person_name ||
                        "Not available";


                    const contact =
                        item.contact_number ||
                        "Not available";


                    const rollNumber =
                        item.roll_number ||
                        "Not available";



                    // =================================================
                    // IMAGE
                    // =================================================

                    const imageUrl =
                        getImageUrl(item);


                    let imageHTML;



                    if (
                        imageUrl !== ""
                    ) {

                        imageHTML = `

                            <img
                                src="${escapeHTML(imageUrl)}"
                                alt="${escapeHTML(itemName)}"
                                class="browse-item-image"
                                onerror="
                                    this.onerror=null;
                                    this.style.display='none';
                                    this.parentElement.innerHTML='<div style=&quot;height:260px;display:flex;align-items:center;justify-content:center;font-size:70px;&quot;>📦</div>';
                                "
                            >

                        `;

                    }
                    else {

                        imageHTML = `

                            <div
                                style="
                                    height:260px;
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    font-size:70px;
                                "
                            >
                                📦
                            </div>

                        `;

                    }



                    // =================================================
                    // CARD HTML
                    // =================================================

                    card.innerHTML = `

                        <div
                            class="item-image ${
                                status === "found"
                                    ? "orange-image"
                                    : "blue-image"
                            }"
                        >

                            ${imageHTML}

                        </div>



                        <div class="item-content">


                            <div class="item-top">

                                <span
                                    class="status ${statusClass}"
                                >

                                    ${statusText}

                                </span>


                                <span class="date">

                                    Recently

                                </span>

                            </div>



                            <h3>

                                ${escapeHTML(itemName)}

                            </h3>



                            <p>

                                ${escapeHTML(description)}

                            </p>



                            <div class="item-location">

                                📍

                                ${escapeHTML(location)}

                            </div>



                            <button
                                class="details-btn"
                                type="button"
                            >

                                View Details

                            </button>



                            <div
                                class="details-box"
                            >

                                <p>

                                    <strong>
                                        Status:
                                    </strong>

                                    ${statusText}

                                </p>


                                <p>

                                    <strong>
                                        Location:
                                    </strong>

                                    ${escapeHTML(location)}

                                </p>


                                <p>

                                    <strong>
                                        Description:
                                    </strong>

                                    ${escapeHTML(description)}

                                </p>


                                <p>

                                    <strong>
                                        Name:
                                    </strong>

                                    ${escapeHTML(personName)}

                                </p>


                                <p>

                                    <strong>
                                        Roll Number:
                                    </strong>

                                    ${escapeHTML(rollNumber)}

                                </p>


                                <p>

                                    <strong>
                                        Contact:
                                    </strong>

                                    ${escapeHTML(contact)}

                                </p>

                            </div>


                        </div>

                    `;



                    // =================================================
                    // VIEW DETAILS BUTTON
                    // =================================================

                    const detailsButton =
                        card.querySelector(
                            ".details-btn"
                        );


                    const detailsBox =
                        card.querySelector(
                            ".details-box"
                        );


                    detailsButton.addEventListener(
                        "click",
                        function() {


                            detailsBox.classList.toggle(
                                "show"
                            );


                            if (
                                detailsBox.classList.contains(
                                    "show"
                                )
                            ) {

                                detailsButton.textContent =
                                    "Hide Details";

                            }
                            else {

                                detailsButton.textContent =
                                    "View Details";

                            }

                        }
                    );



                    resultsContainer.appendChild(
                        card
                    );

                }
            );

        }



        // =====================================================
        // SEARCH BUTTON
        // =====================================================

        searchButton.addEventListener(
            "click",
            function() {

                searchItems();

            }
        );



        // =====================================================
        // ENTER KEY
        // =====================================================

        searchInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    searchItems();

                }

            }
        );



        // =====================================================
        // FILTER CHANGE
        // =====================================================

        statusFilter.addEventListener(
            "change",
            function() {

                searchItems();

            }
        );



        // =====================================================
        // START
        // =====================================================

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                loadItems();

            }
        );


    </script>


</body>

</html>

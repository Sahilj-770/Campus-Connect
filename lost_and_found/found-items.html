<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Found Items - Campus Lost & Found</title>

    <link rel="stylesheet" href="lost.css">

</head>


<body>


    <!-- ================= NAVIGATION BAR ================= -->

    <header class="navbar">

        <div class="logo">

            <img
                src="logo.png"
                alt="Lost & Found Logo"
                class="logo-image"
            >

            <span>
                Campus Lost & Found
            </span>

        </div>


        <nav>

            <a href="lost.html">
                Home
            </a>

            <a href="lost-items.html">
                Lost Items
            </a>

            <a href="found-items.html">
                Found Items
            </a>

            <a href="browse.html">
                Browse Items
            </a>

        </nav>


        <a
            href="lost.html#report"
            class="login-btn"
        >
            Report Item →
        </a>

    </header>



    <!-- ================= FOUND ITEMS PAGE ================= -->

    <section class="items-page">


        <div class="items-heading">

            <p class="small-heading">
                FOUND ITEMS
            </p>


            <h1>

                Items that are
                <span>Found</span>

            </h1>


            <p>

                Browse items that have been found by students on campus.
                You may find something that belongs to you.

            </p>

        </div>



        <!-- ================= FOUND ITEMS ================= -->

        <div
            class="items-grid"
            id="foundItemsGrid"
        >

            <div class="no-items" id="loadingMessage">

                <h3>
                    Loading found items...
                </h3>

                <p>
                    Please wait.
                </p>

            </div>

        </div>


    </section>



    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 Campus Lost & Found
        </p>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const API_URL =
            "http://localhost:3000/api/lost-found/found";


        const foundItemsGrid =
            document.getElementById("foundItemsGrid");



        // =====================================================
        // LOAD FOUND ITEMS FROM EXPRESS + MYSQL
        // =====================================================

        async function loadFoundItems() {

            try {

                const response =
                    await fetch(API_URL);


                if (!response.ok) {

                    throw new Error(
                        "Server returned an error."
                    );

                }


                const items =
                    await response.json();


                console.log(
                    "Found items received:",
                    items
                );


                // Remove loading message

                foundItemsGrid.innerHTML = "";



                // =================================================
                // NO FOUND ITEMS
                // =================================================

                if (
                    !Array.isArray(items) ||
                    items.length === 0
                ) {

                    foundItemsGrid.innerHTML = `

                        <div class="no-items">

                            <h3>
                                No found items reported yet.
                            </h3>

                            <p>
                                Be the first to report a found item.
                            </p>

                        </div>

                    `;

                    return;

                }



                // =================================================
                // CREATE CARDS FROM DATABASE
                // =================================================

                items.forEach(function(item) {


                    const itemName =
                        item.item_name || "Unknown Item";


                    const description =
                        item.description ||
                        "No description provided.";


                    const location =
                        item.location ||
                        "Location not specified";


                    const status =
                        item.status || "found";



                    // =================================================
                    // IMAGE
                    // =================================================

                    let imageHTML = `

                        <span style="font-size: 60px;">
                            📦
                        </span>

                    `;


                    if (
                        item.image &&
                        item.image.trim() !== ""
                    ) {

                        const imagePath =
                            item.image.trim();


                        imageHTML = `

                            <img
                                src="${imagePath}"
                                alt="${escapeHTML(itemName)}"
                                class="lost-item-image"
                                onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                            >

                            <span
                                style="
                                    display:none;
                                    font-size:60px;
                                "
                            >
                                📦
                            </span>

                        `;

                    }



                    // =================================================
                    // CREATE CARD
                    // =================================================

                    const card =
                        document.createElement("div");


                    card.className =
                        "item-card";


                    card.setAttribute(
                        "data-status",
                        status.toLowerCase()
                    );


                    card.innerHTML = `

                        <!-- ================= IMAGE ================= -->

                        <div class="item-image orange-image">

                            ${imageHTML}

                        </div>



                        <!-- ================= CONTENT ================= -->

                        <div class="item-content">


                            <div class="item-top">

                                <span class="status found">

                                    FOUND

                                </span>


                                <span class="date">

                                    Recently

                                </span>

                            </div>



                            <h3>

                                ${escapeHTML(itemName)}

                            </h3>



                            <p>

                                ${escapeHTML(description)}

                            </p>



                            <div class="item-location">

                                📍

                                ${escapeHTML(location)}

                            </div>


                        </div>

                    `;


                    foundItemsGrid.appendChild(card);

                });


            }


            catch (error) {

                console.error(
                    "Found items loading error:",
                    error
                );


                foundItemsGrid.innerHTML = `

                    <div class="no-items">

                        <h3>
                            Could not load found items.
                        </h3>

                        <p>
                            Make sure the Express server is running.
                        </p>

                    </div>

                `;

            }

        }



        // =====================================================
        // PREVENT DATABASE TEXT FROM BEING INTERPRETED AS HTML
        // =====================================================

        function escapeHTML(value) {

            return String(value)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }



        // =====================================================
        // START
        // =====================================================

        loadFoundItems();

    </script>


</body>

</html>
